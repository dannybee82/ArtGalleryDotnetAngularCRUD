<div class="row p-1">
  <button type="button" mat-raised-button color="primary" [routerLink]="['/create-or-update-artist']">
    <mat-icon>add</mat-icon>
    <span>Add Artist</span>
  </button>
</div>
<div class="container p-1">
  <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header data-cy="artists-header">Name</th>
          <td mat-cell *matCellDef="let artist" data-cy="artists-cell">{{ artist.name }}</td>
        </ng-container>

        <ng-container matColumnDef="years">
          <th mat-header-cell *matHeaderCellDef mat-sort-header data-cy="artists-header">Years</th>
          <td mat-cell *matCellDef="let artist" data-cy="artists-cell">{{ artist.yearOfBirth }} - {{ artist.yearOfDeath }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef data-cy="artists-header"></th>
            <td mat-cell *matCellDef="let artist" data-cy="artists-cell">
              <button mat-icon-button color="primary" matTooltip="Edit Artist" [routerLink]="['/create-or-update-artist', artist.id]">
                  <mat-icon>edit</mat-icon>
              </button>
            </td>
        </ng-container>      

        <tr mat-header-row *matHeaderRowDef="displayedColumns()"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns();"></tr>
  </table>
  <mat-paginator [length]="total()"
                [pageSize]="pageSize()"
                [pageSizeOptions]="[5, 10, 25, 100]"
                (page)="updatePagination($event)">
  </mat-paginator>
</div>
